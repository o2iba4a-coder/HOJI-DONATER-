<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire Store 💎</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">💎 FREE FIRE STORE</div>
    <span class="version">V0.1</span>
  </header>
  <main class="container">
    <section class="hero">
      <span class="badge">⚡ БЫСТРО И УДОБНО</span>
      <h1>Пополнение Free Fire 💎</h1>
      <p>Выберите пакет алмазов, укажите Free Fire ID и создайте заказ.</p>
    </section>
    <section>
      <h2>Пакеты алмазов</h2>
      <div id="products" class="products"></div>
    </section>
    <section id="order" class="card hidden">
      <h2>Оформление заказа</h2>
      <div id="selected"></div>
      <label for="playerId">🎮 Free Fire ID</label>
      <input id="playerId" inputmode="numeric" placeholder="Например: 123456789">
      <button id="createOrder">Продолжить</button>
      <p id="message" class="message"></p>
    </section>
  </main>
  <footer>Free Fire Store • Тестовая V0.1</footer>
  <script src="app.js"></script>
</body>
</html>
